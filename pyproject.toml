[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "dutychart"
version = "1.0.0"
description = "Exam Duty Chart Generator for GCE Salem"
dependencies = [
    "pandas",
    "openpyxl",
    "tkcalendar",
    "Pillow",
    "numpy"
]

[tool.setuptools.packages.find]
where = ["."]